name: Python CI Workflow

on:
  push:
    branches:
      - temp

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Tests and Generate Reports
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html \
            --junitxml=reports/junit.xml

      - name: Upload Reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-test-reports
          path: reports/
          if-no-files-found: error
  sonar:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: python-test-reports
          path: reports/
      - name: Verify Coverage Report
        run: |
          ls -lah reports/
          test -f reports/coverage.xml
          head -n 10 reports/coverage.xml
      - name: Inspect Coverage XML
        run: |
          grep -nE '<class |<source>|filename=' reports/coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  CodeQL:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  build-image:
    name: Build and Save Docker Image
    runs-on: ubuntu-latest
    needs: sonar

    env:
      IMAGE_NAME: my-python-app
      IMAGE_TAG: ${{ github.run_id }}-${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          outputs: type=docker

      - name: Save Docker Image
        run: |
          docker save \
            -o my-python-app.tar \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-image
          path: my-python-app.tar
          if-no-files-found: error
          retention-days: 7
  publish-dockerhub:
    name: Publish Docker Hub
    runs-on: ubuntu-latest
    needs: build-image

    env:
      IMAGE_NAME: my-python-app
      IMAGE_TAG: ${{ github.run_id }}-${{ github.sha }}

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v6
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i my-python-app.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKHUB_USERNAME }}
          password: ${{ secrets.DOCKHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ secrets.DOCKHUB_USERNAME }}/learning-github-actions:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKHUB_USERNAME }}/learning-github-actions:${{ env.IMAGE_TAG }}

