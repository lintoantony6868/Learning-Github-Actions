name: my-first-workflow

# Trigger on every push to this repository
on: push
env:
  ENV_TYPE: DEV
  APP_USER: LINTO
  APP_PORT: 80
  APP_VER: 2.1
  

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: Step 1
        run: |
          pwd
          ls -ltr
          hostname

      - name: Step 2 - Checkout
        uses: actions/checkout@v6.1.0

      - name: Step 3 - Create files
        run: |
          echo "Hello Linto!" > myartifact.txt
          echo "This file was created by GitHub Actions." >> myartifact.txt
          echo "Current date: $(date)" >> myartifact.txt

          mkdir artifacts
          echo "ls -ltr" > artifacts/list.txt
          echo "hostname" > artifacts/hostename.txt

      - name: Upload single file artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: single_file
          path: ./myartifact.txt

      

  job2:
    name: JOB2 - Download Single File
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Download single file artifact
        uses: actions/download-artifact@v4
        with:
          name: single_file
          path: downloaded_single

      - name: Referring environment variables
        run: |
          echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER"
          echo "[INFO] Once deployement app is acceccible on port $APP_PORT with verision $APP_VER"
      - name: Referring repository secrets
        run: |
          echo "[INFO] Application Password is ${{ secrets.DEMO_PASSWORD }}"
  job3:
    name: JOB3 - Referring context and variables
    runs-on: ubuntu-latest
    steps:
      - name: Referring context or inbuilt variables
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }} and ${{ github.action_path }}"
          echo "[INFO] Changes Added By ${{ github.actor }}"
          echo "[INFO] Runs on ${{ runner.name }} ${{ runner.os }}"
          echo "[INFO] Current JOB ID is ${{ job.check_run_id }}"
          echo "[INFO] Current github.head_ref ${{ github.ref }}"
      
  staging:
    name: Stage Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Referring Environment Variables
        run: echo "[INFO] Running deployment on ${{ vars.HOST }} using ${{ vars.USER }}"
      - name: Referring Environment Secrets
        run: echo "[INFO] Password ${{ vars.USER }} is ${{ secrets.PASSWORD }}"
    environment: 
      name: Staging
    if: github.ref == 'refs/head/dev'
  production:
    name: Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Referring Environment Variables
        run: echo "[INFO] Running deployment on ${{ vars.HOST }} using ${{ vars.USER }}"
      - name: Referring Environment Secrets
        run: echo "[INFO] Password ${{ vars.USER }} is ${{ secrets.PASSWORD }}"
    environment: 
      name: Production
    if: github.ref == 'refs/head/main'
      
    
      
    
          

  
