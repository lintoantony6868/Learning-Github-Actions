name: ARC Local Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: arc-runner-set

    steps:
      - name: Show runner information
        run: |
          echo "Hello from my local ARC runner!"
          echo "Operating system:"
          uname -a
          echo "Hostname:"
          hostname
          echo "Current directory:"
          pwd

      - name: Keep runner busy briefly
        run: sleep 30
