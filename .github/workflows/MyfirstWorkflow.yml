name: my-first-workflow

# Trigger on every push to this repository
on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: Step 1
        run: |
          pwd
          ls -ltr
          hostname

      - name: Step 2 - Checkout
        uses: actions/checkout@v6.1.0

      - name: Step 3 - Create files
        run: |
          echo "Hello Linto!" > myartifact.txt
          echo "This file was created by GitHub Actions." >> myartifact.txt
          echo "Current date: $(date)" >> myartifact.txt

          mkdir artifacts
          echo "ls -ltr" > artifacts/list.txt
          echo "hostname" > artifacts/hostename.txt

      - name: Upload single file artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: single_file
          path: ./myartifact.txt

      - name: Upload directory artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: directory_artifacts
          path: artifacts/

      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/

      - name: Upload multiple paths with exclusion
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_paths_with_exclusion
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt

  job2:
    name: JOB2 - Download Single File
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Download single file artifact
        uses: actions/download-artifact@v4
        with:
          name: single_file
          path: downloaded_single

      - name: Display downloaded file
        run: |
          echo "Downloaded files:"
          ls -R downloaded_single

          echo "File contents:"
          cat downloaded_single/myartifact.txt

  job3:
    name: JOB3 - Download Directory
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Download directory artifact
        uses: actions/download-artifact@v4
        with:
          name: directory_artifacts
          path: downloaded_directory

      - name: Display downloaded directory
        run: |
          echo "Downloaded files:"
          ls -R downloaded_directory

          echo "Contents of list.txt:"
          cat downloaded_directory/list.txt

          echo "Contents of hostename.txt:"
          cat downloaded_directory/hostename.txt
