name: my-first-workflow
# To get trigger on every push on this repository
on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Running single command in jobs
        run: echo "This is my Github Workflow"
        
      - name: checking os release for Github Hosted Runner
        run: cat /etc/os-release
      - name: calling sleep
        run: sleep 20
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: checking hostname for runner
        run: hostname

      - name: running multiple commands
        run: |
            echo "Hi, This is Linto"
            echo "Current time is 'date'"
            sleep 20
  job3:
    name : JOB3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Job with single dependency
        run: sleep 10

  job4:
    name: JOB4
    needs: [job1,job2,job3]
    runs-on: ubuntu-latest
    steps:
      - name: Job with multiple dependency
        run: sleep 10
  
