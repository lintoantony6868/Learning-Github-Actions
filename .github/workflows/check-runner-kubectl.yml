name: Check ARC Runner kubectl

on:
  workflow_dispatch:

jobs:
  check-kubectl:
    runs-on: arc-runner-set

    steps:
      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mkdir -p "$HOME/.local/bin"
          mv kubectl "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify kubectl installation
        run: |
          kubectl version --client
          command -v kubectl

      - name: Check Kubernetes API access
        run: |
          echo "Checking access to the Nginx Deployment..."
          kubectl get deployment nginx-demo -n default

      - name: Check Kubernetes permissions
        run: |
          echo "Checking deployment permissions..."
          kubectl auth can-i create deployments -n default
          kubectl auth can-i patch deployments -n default
          kubectl auth can-i create services -n default

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Files in current directory:"
          ls -la

          echo "Kubernetes manifests:"
          ls -la k8s/

      - name: Deploy to Kubernetes
        run: |
          ls -la k8s/
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/nginx-demo --timeout=120s
          kubectl get pods -n default
          kubectl get services -n default