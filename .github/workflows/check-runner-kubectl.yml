name: Check ARC Runner kubectl

on:
  workflow_dispatch:

jobs:
  check-kubectl:
    runs-on: arc-runner-set

    steps:
      - name: Check kubectl installation
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
          else
            echo "kubectl is not installed in the ARC runner."
            exit 1
          fi